name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Build et tests
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java }}

      - name: Publier le .jar en artefact
        if: matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar

      - name: Publier le rapport JaCoCo
        if: always() && matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: rapport-jacoco
          path: target/site/jacoco/

  docker:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Télécharger le .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY }}
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et pousser l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ vars.REGISTRY }}/${{ vars.REGISTRY_USER }}/biblio-api:${{ github.ref_name }}

  release:
    needs: docker
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Télécharger le .jar
        uses: actions/download-artifact@v5
        with:
          name: application-jar
          path: target/

      - name: Créer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: target/*.jar