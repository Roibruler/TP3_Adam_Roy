# .github/workflows/ci.yml
name: CI

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Rendre mvnw exécutable
        run: chmod +x mvnw

      - name: Build et tests
        run: ./mvnw -B clean verify -Djava.version=${{ matrix.java }}

      - name: Publier le .jar en artefact
        if: matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: application-jar
          path: target/*.jar

      - name: Publier le rapport JaCoCo
        if: always() && matrix.java == '25'
        uses: actions/upload-artifact@v5
        with:
          name: rapport-jacoco
          path: target/site/jacoco/